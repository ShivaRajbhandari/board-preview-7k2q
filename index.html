<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Board preview</title>
<style>
:root{--ink:#0A1240;--blue:#2445F0;--yellow:#FFCF3F;--cream:#FFF9EA}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--ink)}
#gate{min-height:100%;display:grid;place-items:center;padding:24px}
.card{background:#fff;border:4px solid var(--ink);border-radius:16px;padding:28px;max-width:400px;width:100%;box-shadow:8px 8px 0 #5BCEFA}
h1{font-size:24px;margin:0 0 6px}p{margin:0 0 16px;color:#33406b}
input{width:100%;font:600 18px system-ui;padding:12px 14px;border:3px solid var(--ink);border-radius:10px}
button{cursor:pointer;font:800 17px system-ui;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:11px 18px;margin-top:14px;box-shadow:3px 3px 0 var(--ink)}
#err{color:#B0123C;font-weight:700;margin-top:10px;min-height:1.4em}
#app{display:none;height:100%;flex-direction:column}
#bar{background:var(--ink);color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow-x:auto}
#bar b{white-space:nowrap;margin-right:8px;font-size:14px}
#bar button{margin:0;box-shadow:none;border:2px solid #fff;background:transparent;color:#fff;padding:6px 12px;font-size:14px;white-space:nowrap;border-radius:99px}
#bar button.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
iframe{flex:1;border:0;width:100%;background:#fff}
</style></head><body>

const LABELS={"home.html":"Homepage","form-step1.html":"Travel Fund form: Step 1","form-step2.html":"Travel Fund form: Step 2","logos.html":"Logo options"};
let PAGES=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const raw=b64(BLOB); if(String.fromCharCode(...raw.slice(0,8))!=="Salted__") throw new Error("bad");
  const salt=raw.slice(8,16), data=raw.slice(16);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,384));
  const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,data);
  return JSON.parse(new TextDecoder().decode(pt));
}
function show(name,anchor){
  const fr=document.getElementById('fr');
  document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.p===name));
  fr.onload=()=>{
    const w=fr.contentWindow, doc=fr.contentDocument;
    doc.addEventListener('click',e=>{
      const a=e.target.closest&&e.target.closest('a[href]'); if(!a) return;
      const h=a.getAttribute('href'); const m=h.match(/^([a-z0-9-]+\.html)(#.*)?$/);
      if(m&&PAGES[m[1]]){e.preventDefault();show(m[1],m[2]||"");}
      else if(/^https?:/.test(h)){a.target="_blank";a.rel="noopener";}
    });
    if(anchor){const t=doc.getElementById(anchor.slice(1)); if(t) setTimeout(()=>t.scrollIntoView({behavior:'instant'}),120);}
  };
  fr.srcdoc=PAGES[name];
}
function start(){
  const bar=document.getElementById('bar');
  Object.keys(LABELS).forEach(k=>{const b=document.createElement('button');b.textContent=LABELS[k];b.dataset.p=k;b.onclick=()=>show(k);bar.appendChild(b)});
  document.getElementById('gate').style.display='none';document.getElementById('app').style.display='flex';show('home.html');
}
async function tryPw(pw,quiet){
  try{PAGES=await decrypt(pw);try{sessionStorage.setItem('bp',pw)}catch(e){}start();return true}
  catch(e){if(!quiet)document.getElementById('err').textContent="That password didn't work. Please try again.";return false}
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('err').textContent='';tryPw(document.getElementById('pw').value.trim())});
try{const s=sessionStorage.getItem('bp');if(s)tryPw(s,true)}catch(e){}
